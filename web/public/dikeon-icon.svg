<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dikeon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C2129"/><stop offset="1" stop-color="#330E13"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCF4"/><stop offset="1" stop-color="#EDE2CB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="21" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="91" height="46" rx="19" fill="#FFFFFF" opacity="0.05"/>
  <!-- sombra suave -->
  <g fill="#000" opacity=".3" filter="url(#soft)" transform="translate(0,2)">
    <path d="M45 24.5 A23.2 23.2 0 1 1 45 70.5 A27.5 27.5 0 0 0 45 24.5 Z"/>
    <rect x="23" y="21.5" width="27" height="5" rx="1.5"/>
    <rect x="23" y="66.5" width="27" height="5" rx="1.5"/>
  </g>
  <!-- arco do D (crescente serifado) -->
  <path d="M45 24.5 A23.2 23.2 0 1 1 45 70.5 A27.5 27.5 0 0 0 45 24.5 Z" fill="url(#cream)"/>
  <!-- coluna: capitel, fuste com caneluras, base -->
  <rect x="23" y="21.5" width="27" height="5" rx="1.5" fill="url(#cream)"/>
  <rect x="26" y="27.5" width="21" height="3.5" rx="1.2" fill="url(#cream)"/>
  <rect x="28" y="31" width="17" height="31" fill="url(#cream)"/>
  <path d="M32.5 33.5 V59.5 M36.5 33.5 V59.5 M40.5 33.5 V59.5" stroke="#330E13" stroke-width="1.5" opacity=".35" stroke-linecap="round"/>
  <rect x="26" y="62" width="21" height="3.5" rx="1.2" fill="url(#cream)"/>
  <rect x="23" y="66.5" width="27" height="5" rx="1.5" fill="url(#cream)"/>
